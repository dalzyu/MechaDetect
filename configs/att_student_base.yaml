seed: 42
paths:
  data_root: ${TECHJAM_DATA_ROOT}
  train_manifest: splits/production_eligible/train.parquet
  val_manifest: splits/production_eligible/validation.parquet
  output_root: outputs/att_student_base
  require_materialized: true
preprocessing:
  policy: square_jpeg95
  version: 2
model:
  backbone_type: dinov3
  encoder_id: facebook/dinov3-vitb16-pretrain-lvd1689m
  encoder_revision: null
  encoder_dim: 768
  image_size: 224
  freeze_encoder: false
  trainable_last_layers: 0
  gradient_checkpointing: true
  spectral_expert: false
  use_token_adapter: true
  trunk_dim: 512
  branch_dim: 256
  dropout: 0.1
training:
  stage: att_student_base
  epochs: 1
  physical_batch_size: 2
  gradient_accumulation: 12
  required_world_size: 2
  num_workers: 4
  optimizer: adamw
  precision: bf16
  encoder_lr: 1.0e-5
  heads_lr: 5.0e-5
  layerwise_lr_decay: 0.85
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  warmup_fraction: 0.05
  master_port: 29503
  cuda_visible_devices: "2,3"
loss:
  provenance_original: 1.0
  provenance_transformed: 1.0
  prediction_consistency: 0.5
  feature_consistency: 0.0
att:
  num_candidates: 3
  families:
    - jpeg
    - blur
    - resize
    - noise
    - color
    - crop
  severities:
    jpeg: [90.0, 70.0, 50.0, 30.0]
    blur: [0.5, 1.0, 2.0]
    resize: [0.5, 0.25]
    noise: [0.02, 0.05, 0.10]
    color: [0.10, 0.20, 0.30]
    crop: [0.70, 0.80, 0.90]
  score_without_gradients: true
  backprop_hardest_only: true
