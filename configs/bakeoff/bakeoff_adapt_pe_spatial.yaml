seed: 42
paths:
  data_root: /workspace/techjam26/data
  train_manifest: manifests/ablation12k.csv
  val_manifest: manifests/strict_unseen_probe.csv
  output_root: /workspace/outputs
  initial_checkpoint: /workspace/outputs/bakeoff_frozen_pe_spatial/checkpoint-step-188.pt
preprocessing:
  policy: square_jpeg95
  version: 2
model:
  backbone_type: pe_spatial
  encoder_id: facebook/PE-Spatial-G14-448
  encoder_revision: 12594718a2702146ec5f73a6aef4e3cc26c28710
  image_size: 448
  encoder_dim: 1536
  trunk_dim: 512
  use_token_adapter: true
  branch_dim: 256
  dropout: 0.1
  freeze_encoder: true
  trainable_last_layers: 13
  gradient_checkpointing: true
  spectral_expert: false
training:
  stage: bakeoff_adapt_pe_spatial
  epochs: 1
  physical_batch_size: 1
  gradient_accumulation: 64
  num_workers: 4
  precision: bf16
  encoder_lr: 3.0e-6
  layerwise_lr_decay: 0.85
  heads_lr: 1.0e-4
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  warmup_fraction: 0.05
  generator_balanced_sampler: true
  checkpoint_interval: 0
  ema:
    enabled: false
loss:
  provenance_original: 1.0
  provenance_transformed: 0.0
  prediction_consistency: 0.0
  feature_consistency: 0.0
  mask_focal: 0.5
  mask_dice: 0.5
  ema_consistency: 0.0
transforms:
  families: []
