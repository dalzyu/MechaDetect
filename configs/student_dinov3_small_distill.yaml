seed: 42
paths:
  data_root: ${TECHJAM_DATA_ROOT}
  train_manifest: splits/production_eligible/train.parquet
  val_manifest: splits/production_eligible/validation.parquet
  output_root: outputs/student_dinov3_small
  require_materialized: true
preprocessing:
  policy: square_jpeg95
  version: 2
model:
  backbone_type: dinov3
  encoder_id: facebook/dinov3-vits16-pretrain-lvd1689m
  encoder_revision: null
  image_size: 224
  encoder_dtype: float32
  encoder_dim: 384
  trunk_dim: 512
  use_token_adapter: true
  branch_dim: 256
  dropout: 0.1
  freeze_encoder: false
  trainable_last_layers: 0
  gradient_checkpointing: true
  spectral_expert: false
  spectral_image_size: 384
training:
  stage: student_dinov3_small
  epochs: 2
  physical_batch_size: 12
  gradient_accumulation: 4
  required_world_size: 1
  num_workers: 4
  optimizer: adamw
  precision: bf16
  encoder_lr: 2.0e-5
  heads_lr: 2.0e-4
  layerwise_lr_decay: 0.85
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  warmup_fraction: 0.05
  master_port: 29501
  cuda_visible_devices: "0"
  deterministic_coverage_sampler: true
  checkpoint_coverage_milestones: [0.25, 0.50, 0.75, 1.00]
loss:
  provenance_original: 1.0
  provenance_transformed: 1.0
  prediction_consistency: 1.0
  feature_consistency: 0.5
  mask_focal: 0.0
  mask_dice: 0.0
  ema_consistency: 2.0
  teacher_feature_consistency: 0.5
transforms:
  families: [jpeg, blur, resize, noise, color, crop]
