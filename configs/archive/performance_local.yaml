seed: 42

paths:
  data_root: ${TECHJAM_DATA_ROOT}
  train_manifest: splits/performance_sanity/train.csv
  val_manifest: splits/performance_sanity/validation.csv
  output_root: ${TECHJAM_OUTPUT_ROOT}

preprocessing:
  policy: square_jpeg95
  version: 2

model:
  encoder_id: rnagabh/gemma4-vision-encoder
  encoder_revision: 3a8691c3fe6dc28858f5b74d54f4afd0b4cb260c
  visual_tokens: 1120
  encoder_dim: 1152
  trunk_dim: 512
  branch_dim: 256
  dropout: 0.1
  freeze_encoder: true
  trainable_last_layers: 0
  gradient_checkpointing: true
  spectral_expert: true
  spectral_image_size: 384
  spectral_pretrained: true

training:
  stage: performance_architecture_smoke
  epochs: 3
  physical_batch_size: 1
  gradient_accumulation: 16
  num_workers: 0
  precision: bf16
  encoder_lr: 1.0e-5
  heads_lr: 3.0e-4
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  warmup_fraction: 0.05
  generator_balanced_sampler: true
  checkpoint_interval: 100
  ema:
    enabled: true
    decay: 0.999
    confidence_threshold: 0.80

loss:
  provenance_original: 1.0
  provenance_transformed: 1.0
  prediction_consistency: 0.5
  feature_consistency: 0.0
  mask_focal: 0.5
  mask_dice: 0.5
  ema_consistency: 0.5

transforms:
  families: [jpeg, blur, resize, noise, color, crop]
