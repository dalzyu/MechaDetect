[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "techjam-aigc-detector"
version = "0.1.0"
description = "Robust three-class image provenance detector"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "accelerate>=1.12,<2",
  "datasets>=4.5,<5",
  "huggingface-hub>=1.4,<2",
  "modelscope>=1.37,<2",
  "numpy>=2.2,<3",
  "pandas>=3,<4",
  "pillow>=11,<13",
  "python-dotenv>=1.1,<2",
  "pyyaml>=6,<7",
  "safetensors>=0.7,<1",
  "torch==2.10.0",
  "torchvision==0.25.0",
  "transformers==5.10.1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
techjam-train = "aigc_detector.train:main"
techjam-predict = "aigc_detector.predict:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aigc_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
